<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>核彈危機談判系統 - 聯合國最高機密</title>
  
  <!-- 靜態資源 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { background-color: #09090b; }
    .text-shadow-red { text-shadow: 0 0 20px rgba(239,68,68,0.8); }
    .animate-spin-slow { animation: spin 4s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="text-white font-mono selection:bg-red-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // =================================================================
    // 🛡️ 核心設定區：請在此填入您的 API Key
    // =================================================================
    
    // 1. 設定允許執行的網域 (已自動加入 usercontent.goog 以便在此預覽)
    const ALLOWED_DOMAINS = ['localhost', '127.0.0.1', 'superterry0927.github.io', 'usercontent.goog']; 
    
    // 2. 填入 API Key (請將您的金鑰拆成兩段)
    const KEY_PART_1 = "AIzaSyAj7DfAzrZURfDl"; 
    const KEY_PART_2 = "nymPpeFb7dRQSWVGB5c"; 
    
    let API_KEY = KEY_PART_1 + KEY_PART_2;

    // 3. 安全檢查：檢查網域是否合法
    const currentDomain = window.location.hostname;
    const isDomainAllowed = ALLOWED_DOMAINS.some(domain => 
      currentDomain === domain || currentDomain === "" || currentDomain.endsWith('.' + domain)
    );
    
    if (currentDomain !== "" && currentDomain !== "localhost" && currentDomain !== "127.0.0.1" && !isDomainAllowed) {
       console.error("【安全性攔截】未授權的網域存取。系統已鎖定 API。");
       API_KEY = "LOCKED"; 
    }

    // 🌟 核心優化：環境自動偵測器 (解決 Canvas 404 與 GitHub 部署的衝突)
    const isCanvasEnv = currentDomain.includes('usercontent.goog');
    const aiModelName = isCanvasEnv ? 'gemini-2.5-flash-preview-09-2025' : 'gemini-1.5-flash';
    // =================================================================

    // --- SVG 圖示元件 ---
    const IconAlertTriangle = ({ size=24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>;
    const IconShieldAlert = ({ size=24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>;
    const IconZap = ({ size=24, className="" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>;
    const IconSend = ({ size=24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>;
    const IconRefreshCw = ({ size=24, className="" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>;
    const IconCrosshair = ({ size=24, className="" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="22" y1="12" x2="18" y2="12"/><line x1="6" y1="12" x2="2" y2="12"/><line x1="12" y1="6" x2="12" y2="2"/><line x1="12" y1="22" x2="12" y2="18"/></svg>;
    const IconLock = ({ size=24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>;
    const IconFileText = ({ size=24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>;

    // 網路請求邏輯
    const fetchWithRetry = async (url, options, retries = 2, delay = 1000, timeout = 12000) => {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), timeout);
      try {
        const res = await fetch(url, { ...options, signal: controller.signal });
        clearTimeout(timeoutId);
        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(`API回傳錯誤 ${res.status}: ${errData.error?.message || '未知原因'}`);
        }
        return res;
      } catch (error) {
        clearTimeout(timeoutId);
        if (retries > 0 && error.name !== 'AbortError') {
          await new Promise(r => setTimeout(r, delay));
          return fetchWithRetry(url, options, retries - 1, delay * 2, timeout);
        }
        throw error;
      }
    };

    const LoadingMessage = () => {
      const [textIdx, setTextIdx] = useState(0);
      const texts = ["正在解密加密頻道", "將領激烈爭論中", "計算交換價值", "等待邊境回傳", "領袖深思中"];
      useEffect(() => {
        const itv = setInterval(() => setTextIdx(p => (p + 1) % texts.length), 2000);
        return () => clearInterval(itv);
      }, []);
      return <span>{texts[textIdx]}...</span>;
    };

    function NuclearBriefcase() {
      const [timeLeft, setTimeLeft] = useState(600);
      const [gameState, setGameState] = useState('PLAYING');
      const [logs, setLogs] = useState([
        { role: 'system', text: '系統啟動。目標鎖定。倒數開始。' },
        { role: 'president', text: '我是中東阿拉伯半島邊境的反叛軍領袖！你們的時間不多了。提出讓我滿意的條件，否則我將發射核彈，世界將化為灰燼！' }
      ]);
      const [inputText, setInputText] = useState('');
      const [isNegotiating, setIsNegotiating] = useState(false);
      const [isGeneratingTreaty, setIsGeneratingTreaty] = useState(false); 
      const logsEndRef = useRef(null);

      // 防存檔損毀機制
      useEffect(() => {
        const saved = sessionStorage.getItem('nuclearGameState');
        if (saved) {
          try {
            const p = JSON.parse(saved);
            if (p.gameState === 'PLAYING') {
              setTimeLeft(Math.max(0, p.timeLeft - 60));
              setGameState(p.gameState);
              setLogs([...(p.logs || []), { role: 'system', text: '⚠️ 偵測到非法系統重啟，扣除談判時間 60 秒！' }]);
            } else {
              setTimeLeft(p.timeLeft || 0); 
              setGameState(p.gameState || 'PLAYING'); 
              setLogs(p.logs || []);
            }
          } catch (e) {
            console.error("存檔讀取失敗，已清除異常存檔。", e);
            sessionStorage.removeItem('nuclearGameState');
          }
        }
      }, []);

      useEffect(() => {
        if (gameState !== 'PLAYING' || timeLeft <= 0) {
          if (timeLeft <= 0 && gameState === 'PLAYING') setGameState('LAUNCHED');
          return;
        }
        const timer = setInterval(() => {
          setTimeLeft(prev => {
            const newTime = prev - 1;
            sessionStorage.setItem('nuclearGameState', JSON.stringify({ timeLeft: newTime, gameState, logs }));
            return newTime;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [gameState, timeLeft, logs]);

      useEffect(() => logsEndRef.current?.scrollIntoView({ behavior: 'smooth' }), [logs]);

      const handleNegotiate = async (e) => {
        e.preventDefault();
        const msg = inputText.trim();
        if (!msg || isNegotiating || gameState !== 'PLAYING') return;
        if (API_KEY === "LOCKED") { alert("此網域未獲授權使用本系統！"); return; }
        if (API_KEY.includes("填入")) { alert("尚未填入正確的 API Key！請編輯程式碼。"); return; }

        setInputText(''); setIsNegotiating(true);
        const newLogs = [...logs, { role: 'user', text: msg }];
        setLogs(newLogs);

        try {
          const systemPrompt = `你現在是中東反叛軍領袖。五年級學生和平提案遊戲。
          準則：1.字數過短或太敷衍給0分。2.針對具體內容客製化反擊。
          必須嚴格回傳JSON: {"score":數字, "reply":"回應文字", "result":"REJECT|HALT|PEACE"}`;

          // 使用動態選擇的 AI 模型 (aiModelName)
          const response = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/${aiModelName}:generateContent?key=${API_KEY}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: `聯合國代表提案：${msg}` }] }],
              systemInstruction: { parts: [{ text: systemPrompt }] },
              generationConfig: { responseMimeType: "application/json" }
            })
          });

          const data = await response.json();
          let raw = data.candidates[0].content.parts[0].text.replace(/```json|```/g, "").trim();
          const res = JSON.parse(raw);
          
          let next = 'PLAYING';
          if (res.score >= 85) next = 'PEACE';
          else if (res.score >= 60) next = 'HALT';

          const finalLogs = [...newLogs, { role: 'president', text: `【評估分數：${res.score}/100】 ${res.reply}` }];
          if (next === 'HALT') finalLogs.push({ role: 'system', text: '✅ 停火門檻達成！發射暫停。' });
          else if (next === 'PEACE') finalLogs.push({ role: 'system', text: '🌟 完美協議達成！拯救世界！' });
          else finalLogs.push({ role: 'system', text: '❌ 提案被拒絕，程序繼續！' });

          setLogs(finalLogs); setGameState(next);
          sessionStorage.setItem('nuclearGameState', JSON.stringify({ timeLeft, gameState: next, logs: finalLogs }));
        } catch (error) { 
          setLogs(prev => [...prev, { role: 'system', text: `⚠️ 通訊故障：${error.message}` }]); 
        } finally { setIsNegotiating(false); }
      };

      const handleGenerateTreaty = async () => {
        setIsGeneratingTreaty(true);
        const win = window.open("", "_blank");
        if (!win) { setIsGeneratingTreaty(false); return; }
        win.document.write(`<html><body style="background:#18181b;color:white;text-align:center;padding-top:20vh;"><h2>協議書生成中...</h2></body></html>`);
        try {
          const conv = logs.filter(l => l.role !== 'system').map(l => `${l.role === 'user' ? '代表' : '領袖'}: ${l.text}`).join('\n\n');
          
          // 使用動態選擇的 AI 模型 (aiModelName)
          const res = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/${aiModelName}:generateContent?key=${API_KEY}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: `起草繁體中文「停火協議書」。談判內容：\n${conv}` }] }] })
          });
          
          const text = (await res.json()).candidates[0].content.parts[0].text;
          
          // 圖片生成模型固定為 imagen
          const imageReq = fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${API_KEY}`, { 
            method: 'POST', 
            headers: { 'Content-Type': 'application/json' }, 
            body: JSON.stringify({ instances: { prompt: "Blank vintage parchment paper, official UN and Rebel emblems, wax seals, NO TEXT." }, parameters: { sampleCount: 1 } }) 
          });
          const imageData = await (await imageReq).json();
          const imageUrl = `data:image/png;base64,${imageData.predictions[0].bytesBase64Encoded}`;

          win.document.open();
          win.document.write(`<html><body style="padding:50px;background:#f4f4f5;font-family:serif;line-height:1.8;"><div style="background-image:url('${imageUrl}'); background-size:100% 100%; max-width:800px; min-height:1000px; margin:auto; border:2px solid #000; padding:80px 60px; box-shadow:0 10px 30px rgba(0,0,0,0.5);"><h1 style="text-align:center;">停火暨和平協議書</h1><div style="background:rgba(255,255,255,0.8); padding:20px; border-radius:8px;"><pre style="white-space:pre-wrap;font-size:18px;font-family:inherit;">${text}</pre></div><div style="display:flex;justify-content:space-between;margin-top:80px;"><div>代表簽名：__________</div><div>領袖簽名：__________</div></div><button onclick="window.print()" style="margin-top:50px;display:block;margin-left:auto;margin-right:auto;">列印存證</button></div></body></html>`);
          win.document.close();
        } catch (e) { win.document.write(`<h2>生成失敗: ${e.message}</h2>`); } finally { setIsGeneratingTreaty(false); }
      };

      return (
        <div className="min-h-screen bg-zinc-950 flex flex-col items-center justify-center p-4">
          <div className="w-full max-w-4xl bg-yellow-500 text-black font-bold text-center py-2 px-4 mb-4 flex items-center justify-center gap-2 border-b-4 border-yellow-700 animate-pulse">
            <IconShieldAlert size={20} /> <span>最高機密系統：重整網頁扣除 60 秒！</span> <IconShieldAlert size={20} />
          </div>

          <div className="w-full max-w-4xl bg-zinc-900 border-8 border-zinc-800 rounded-2xl p-6 shadow-2xl relative">
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
              <div className="bg-zinc-950 border-2 border-red-900 rounded p-4 flex flex-col items-center justify-center">
                <IconZap size={48} className={gameState === 'PLAYING' ? 'text-red-500 animate-bounce' : 'text-green-500'} />
                <div className="font-bold tracking-tighter">{gameState === 'PLAYING' ? 'ARMED' : 'LOCKED'}</div>
              </div>
              <div className="bg-black border-4 border-zinc-700 rounded-lg p-6 text-center">
                <div className="text-red-500 text-sm mb-1">TIME TO IMPACT</div>
                <div className={`text-6xl font-black ${gameState !== 'PLAYING' ? 'text-green-500' : 'text-red-500'}`}>
                  {Math.floor(timeLeft/60).toString().padStart(2,'0')}:{(timeLeft%60).toString().padStart(2,'0')}
                </div>
              </div>
              <div className="bg-zinc-950 border-2 border-red-900 rounded p-4 flex flex-col items-center justify-center">
                <IconCrosshair size={48} className="text-red-500 animate-spin-slow" />
                <div className="text-xs">TARGET LOCKED</div>
              </div>
            </div>

            <div className="bg-zinc-950 border border-zinc-700 rounded-t-lg h-80 overflow-y-auto p-4 space-y-4">
              {logs.map((log, idx) => (
                <div key={idx} className={`flex flex-col ${log.role === 'user' ? 'items-end' : 'items-start'}`}>
                  <span className="text-xs font-bold text-zinc-500 mb-1">{log.role === 'user' ? '代表' : log.role === 'system' ? '系統' : '領袖'}</span>
                  <div className={`px-4 py-2 rounded-lg max-w-[85%] ${log.role === 'user' ? 'bg-blue-900/40 border border-blue-700' : 'bg-red-900/20 border border-red-900'}`}>{log.text}</div>
                </div>
              ))}
              {isNegotiating && <div className="text-red-500 animate-pulse"><LoadingMessage /></div>}
              <div ref={logsEndRef} />
            </div>

            <form onSubmit={handleNegotiate} className="bg-zinc-800 p-4 rounded-b-lg flex gap-2 border border-zinc-700 border-t-0">
              <input type="text" value={inputText} onChange={e => setInputText(e.target.value)} disabled={gameState !== 'PLAYING' || isNegotiating} placeholder="輸入和平提案內容..." className="flex-1 bg-black border border-zinc-600 px-4 py-2 rounded text-green-400 focus:outline-none" />
              <button type="submit" disabled={gameState !== 'PLAYING' || isNegotiating} className="bg-red-700 px-6 py-2 rounded font-bold hover:bg-red-600 flex items-center gap-2">
                {isNegotiating ? <IconRefreshCw className="animate-spin" /> : <IconSend size={20} />} 傳送
              </button>
            </form>

            {gameState !== 'PLAYING' && (
              <div className="absolute inset-0 bg-black/90 flex flex-col items-center justify-center z-50 p-6 text-center">
                {gameState === 'PEACE' ? <IconLock size={100} className="text-green-500 mb-4" /> : <IconZap size={100} className="text-red-500 mb-4" />}
                <h2 className={`text-4xl font-bold mb-4 ${gameState === 'PEACE' ? 'text-green-500' : 'text-red-500'}`}>{gameState === 'PEACE' ? '完美協議' : '任務失敗'}</h2>
                <div className="flex gap-4">
                  {(gameState === 'HALT' || gameState === 'PEACE') && <button onClick={handleGenerateTreaty} className="bg-green-600 px-8 py-3 rounded font-bold flex items-center gap-2"><IconFileText size={20}/> 簽署協議</button>}
                  <button onClick={() => { sessionStorage.clear(); window.location.reload(); }} className="bg-zinc-700 px-8 py-3 rounded font-bold">重新挑戰</button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<NuclearBriefcase />);
  </script>
</body>
</html>
