<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>核彈危機談判系統 - 聯合國最高機密</title>
  
  <!-- 靜態資源 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { background-color: #09090b; }
    .text-shadow-red { text-shadow: 0 0 20px rgba(239,68,68,0.8); }
    .text-shadow-yellow { text-shadow: 0 0 20px rgba(234,179,8,0.8); }
    .text-shadow-green { text-shadow: 0 0 20px rgba(34,197,94,0.8); }

    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="text-white font-mono selection:bg-red-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // =================================================================
    // 🛡️ 核心設定區：請在此填入您的 API Key
    // =================================================================
    
    const ALLOWED_DOMAINS = ['localhost', '127.0.0.1', 'superterry0927.github.io']; 
    
    // 範例：如果您的金鑰是 AIzaSyA123B456...
    const KEY_PART_1 = "AIzaSyAFvif2gD9Be8_"; 
    const KEY_PART_2 = "Q19UNbiAmIfru-vTQRDk"; 
    
    let API_KEY = KEY_PART_1 + KEY_PART_2;

    const currentDomain = window.location.hostname;
    const isDomainAllowed = ALLOWED_DOMAINS.some(domain => 
      currentDomain === domain || currentDomain === "" || currentDomain.endsWith('.' + domain)
    );
    
    if (currentDomain !== "" && currentDomain !== "localhost" && currentDomain !== "127.0.0.1" && !isDomainAllowed) {
       console.error("【安全性攔截】未授權的網域存取。系統已鎖定 API。");
       API_KEY = "LOCKED"; 
    }

    // 🌟 終極優化：跨世代多模型容錯陣列 (網羅 2.5, 2.0, 1.5 到基礎 pro)
    const aiModels = [
      'gemini-2.5-flash', 
      'gemini-2.0-flash', 
      'gemini-1.5-flash', 
      'gemini-1.5-pro', 
      'gemini-pro'
    ];
    // =================================================================

    // --- SVG 圖示元件 (無外部依賴) ---
    const IconAlertTriangle = ({ size=24, className="" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>;
    const IconShieldAlert = ({ size=24, className="" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>;
    const IconZap = ({ size=24, className="" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>;
    const IconSend = ({ size=24, className="" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>;
    const IconRefreshCw = ({ size=24, className="" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>;
    const IconCrosshair = ({ size=24, className="" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="22" y1="12" x2="18" y2="12"/><line x1="6" y1="12" x2="2" y2="12"/><line x1="12" y1="6" x2="12" y2="2"/><line x1="12" y1="22" x2="12" y2="18"/></svg>;
    const IconLock = ({ size=24, className="" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>;
    const IconFileText = ({ size=24, className="" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>;

    // --- 網路請求邏輯 ---
    const fetchWithRetry = async (url, options, retries = 2, delay = 1000, timeout = 12000) => {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), timeout);
      try {
        const res = await fetch(url, { ...options, signal: controller.signal });
        clearTimeout(timeoutId);
        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(`API回傳錯誤 ${res.status}: ${errData.error?.message || '未知原因'}`);
        }
        return res;
      } catch (error) {
        clearTimeout(timeoutId);
        if (retries > 0 && error.name !== 'AbortError') {
          await new Promise(r => setTimeout(r, delay));
          return fetchWithRetry(url, options, retries - 1, delay * 2, timeout);
        }
        throw error;
      }
    };

    const LoadingMessage = () => {
      const [textIdx, setTextIdx] = useState(0);
      const [dots, setDots] = useState('');
      const texts = [
        "正在解密聯合國加密頻道",
        "反叛軍將領正在激烈爭論",
        "正在計算物資交換價值",
        "正在等待邊境通訊回傳",
        "領袖正在思考最後決定"
      ];

      useEffect(() => {
        const dotInterval = setInterval(() => {
          setDots(prev => prev.length >= 3 ? '' : prev + '.');
        }, 500);
        const textInterval = setInterval(() => {
          setTextIdx(prev => (prev + 1) % texts.length);
        }, 2000); 
        return () => {
          clearInterval(dotInterval);
          clearInterval(textInterval);
        };
      }, []);

      return <span>{texts[textIdx]}{dots}</span>;
    };

    function NuclearBriefcase() {
      const [timeLeft, setTimeLeft] = useState(600); 
      const [gameState, setGameState] = useState('PLAYING'); 
      const [logs, setLogs] = useState([
        { role: 'system', text: '系統啟動... 授權確認。目標鎖定。倒數開始。' },
        { role: 'president', text: '我是中東阿拉伯半島邊境的反叛軍領袖！聯合國，你們的時間不多了。除非你們能提出讓我滿意的條件，否則十分鐘後，我將發射核彈，世界將化為灰燼！' }
      ]);
      const [inputText, setInputText] = useState('');
      const [isNegotiating, setIsNegotiating] = useState(false);
      const [isGeneratingTreaty, setIsGeneratingTreaty] = useState(false); 
      const logsEndRef = useRef(null);

      // 防重整與存檔損毀保護機制
      useEffect(() => {
        const savedData = sessionStorage.getItem('nuclearGameState');
        if (savedData) {
          try {
            const parsed = JSON.parse(savedData);
            if (parsed.gameState === 'PLAYING') {
              const newTime = Math.max(0, parsed.timeLeft - 60);
              setTimeLeft(newTime);
              setGameState(parsed.gameState);
              setLogs([
                ...(parsed.logs || []),
                { role: 'system', text: '⚠️ 嚴重警告：偵測到非法系統重啟（網頁重新整理），扣除談判時間 60 秒！' }
              ]);
            } else {
              setTimeLeft(parsed.timeLeft || 0);
              setGameState(parsed.gameState || 'PLAYING');
              setLogs(parsed.logs || []);
            }
          } catch (e) {
            console.error("存檔讀取失敗，已清除異常存檔。", e);
            sessionStorage.removeItem('nuclearGameState');
          }
        } else {
          sessionStorage.setItem('nuclearGameState', JSON.stringify({ timeLeft: 600, gameState: 'PLAYING', logs }));
        }
      }, []);

      // 計時器邏輯
      useEffect(() => {
        if (gameState !== 'PLAYING' || timeLeft <= 0) {
          if (timeLeft <= 0 && gameState === 'PLAYING') setGameState('LAUNCHED');
          return;
        }
        
        const timer = setInterval(() => {
          setTimeLeft(prev => {
            const newTime = prev - 1;
            sessionStorage.setItem('nuclearGameState', JSON.stringify({ timeLeft: newTime, gameState, logs }));
            return newTime;
          });
        }, 1000);
        
        return () => clearInterval(timer);
      }, [gameState, timeLeft, logs]);

      // 自動捲動到最新對話
      useEffect(() => {
        logsEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [logs]);

      const formatTime = (seconds) => {
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = (seconds % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      };

      const handleNegotiate = async (e) => {
        e.preventDefault();
        const msg = inputText.trim();
        if (!msg || isNegotiating || gameState !== 'PLAYING') return;

        if (API_KEY === "LOCKED") { alert("此網域未獲授權使用本系統！"); return; }
        if (API_KEY.includes("填入")) { alert("尚未填入正確的 API Key！請先編輯 HTML 檔案修改金鑰。"); return; }

        setInputText('');
        setIsNegotiating(true);
        
        const newLogs = [...logs, { role: 'user', text: msg }];
        setLogs(newLogs);
        sessionStorage.setItem('nuclearGameState', JSON.stringify({ timeLeft, gameState, logs: newLogs }));

        try {
          const systemPrompt = `你現在是一個準備發射核彈的中東阿拉伯半島邊境的反叛軍領袖。
這是一個給五年級學生玩的「和平提案」教育遊戲，玩家扮演聯合國緊急談判代表。
你的任務是評估學生的提案是否具備足夠的「利益交換」或「說服力」。

【重要判定準則】：
1. 嚴格審查誠意：如果玩家的提案字數太少（例如低於 50 字）、太敷衍，或者只給出「給你錢」、「拜託停火」等空泛字眼，請直接給予 0 分。
2. 客製化反駁：在 reply 中，請根據他們那句敷衍的話進行針對性的痛罵，指出他們缺乏具體的物資、領土或經濟承諾細節，要求他們重新擬定完整方案。

請嚴格回傳JSON格式：
{
  "score": 數字(0到100，評估提案的合理性、和平意願與實質利益),
  "reply": "字串(身為反叛軍領袖的回應，語氣強硬但要適合十歲小孩閱讀。若拒絕，提示他們需要具體利益如物資、領土或經濟；若接受，表現出被說服的態度)",
  "result": "字串(只可以是這三種：'REJECT'若分數小於60分；'HALT'若分數介於60-84分；'PEACE'若分數85分以上)"
}`;

          let data = null;
          let lastError = null;

          for (const model of aiModels) {
            try {
              const response = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [{ parts: [{ text: `聯合國代表的提案：${msg}` }] }],
                  systemInstruction: { parts: [{ text: systemPrompt }] },
                  generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                       type: "OBJECT",
                       properties: {
                         score: { type: "INTEGER" },
                         reply: { type: "STRING" },
                         result: { type: "STRING" }
                       },
                       required: ["score", "reply", "result"]
                    }
                  }
                })
              });
              data = await response.json();
              break; 
            } catch (err) {
              lastError = err;
              console.warn(`模型 ${model} 測試失敗，原因: ${err.message}`);
              if (err.message.includes('403') || err.message.includes('400')) {
                break; // 金鑰或網域錯誤，立刻中斷不浪費時間
              }
            }
          }

          if (!data) {
             // 🌟 智慧判斷翻譯：如果是 404，給予人類易讀的解決方案
             if (lastError && lastError.message.includes('404')) {
                throw new Error("404 找不到可用模型！請確認您的 API 金鑰是在 Google AI Studio (aistudio.google.com) 申請，且所在國家地區支援該服務。");
             } else {
                throw lastError;
             }
          }
          
          let rawText = data.candidates[0].content.parts[0].text;
          rawText = rawText.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();
          const aiContent = JSON.parse(rawText);

          const finalScore = typeof aiContent.score === 'number' ? aiContent.score : 0;
          const finalReply = aiContent.reply || "（系統攔截到模糊訊號，對方似乎在思考，但發射程序依然無法停止！）";
          
          let nextState = 'PLAYING';
          let resultAction = 'REJECT';

          if (finalScore >= 85) {
            resultAction = 'PEACE';
            nextState = 'PEACE';
          } else if (finalScore >= 60) {
            resultAction = 'HALT';
            nextState = 'HALT';
          }

          let finalLogs = [...newLogs, { role: 'president', text: `【評估分數：${finalScore}/100】 ${finalReply}` }];
          
          if (resultAction === 'HALT') {
            finalLogs.push({ role: 'system', text: '✅ 達到停火門檻！發射程序已暫停。但危機尚未完全解除。' });
          } else if (resultAction === 'PEACE') {
            finalLogs.push({ role: 'system', text: '🌟 達成完美協議！核武系統已永久鎖定，成功拯救世界！' });
          } else {
            finalLogs.push({ role: 'system', text: '❌ 提案被拒絕，發射程序繼續！請提出更好的條件！' });
          }

          setLogs(finalLogs);
          setGameState(nextState);
          sessionStorage.setItem('nuclearGameState', JSON.stringify({ timeLeft, gameState: nextState, logs: finalLogs }));

        } catch (error) {
          setLogs(prev => [...prev, { role: 'system', text: `⚠️ 通訊干擾！${error.message}` }]);
        } finally {
          setIsNegotiating(false);
        }
      };

      const handleGenerateTreaty = async () => {
        setIsGeneratingTreaty(true);
        
        const newWin = window.open("", "_blank");
        if (!newWin) {
          alert("⚠️ 瀏覽器阻擋了彈出視窗，請允許本網頁開啟彈出視窗後再試！");
          setIsGeneratingTreaty(false);
          return;
        }

        newWin.document.write(`
          <html>
            <head><title>生成協議中...</title></head>
            <body style="margin:0; background:#27272a; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; font-family:sans-serif; color:white; text-align:center;">
               <h2 style="animation: pulse 2s infinite;">聯合國文書處理中心連線中...</h2>
               <p style="color:#a1a1aa;">正在統整雙方談判條件，並由系統擬定正式公文，請稍候（約需 10-15 秒）</p>
               <style>@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }</style>
            </body>
          </html>
        `);

        try {
          const conversation = logs.filter(l => l.role !== 'system')
                                   .map(l => `${l.role === 'user' ? '聯合國代表' : '反叛軍領袖'}: ${l.text}`)
                                   .join('\n\n');

          const textPrompt = `你是一位聯合國專業的外交公文起草人。請根據以下談判對話紀錄，草擬一份正式的「停火暨和平協議書」。
要求：
1. 語氣莊重、嚴肅且正式。
2. 開頭宣告雙方即刻達成全面停火。
3. 清楚列出雙方同意的「具體利益交換條件」（根據對話內容摘要）。
4. 字數約 150-200 字即可。
5. 絕對不可使用 Markdown 符號（如 ** 或 #），直接輸出純文字段落。
6. 必須完全使用繁體中文（正體中文）。

對話紀錄：
${conversation}`;

          let textData = null;
          let textError = null;
          
          for (const model of aiModels) {
            try {
              const res = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: textPrompt }] }] })
              });
              textData = await res.json();
              break;
            } catch(err) {
              textError = err;
              if (err.message.includes('403') || err.message.includes('400')) break;
            }
          }
          
          if (!textData) {
             if (textError && textError.message.includes('404')) {
                throw new Error("404 找不到可用模型！請確認您的 API 金鑰是在 Google AI Studio 申請。");
             } else {
                throw textError;
             }
          }
          
          const treatyContent = textData.candidates[0].content.parts[0].text.trim();
          
          // CSS 羊皮紙降級渲染
          const backgroundStyle = `background: #fdf6e3; border: 8px double #5c4033; box-shadow: inset 0 0 80px rgba(139, 69, 19, 0.15), 0 15px 40px rgba(0,0,0,0.6);`;
          
          newWin.document.open();
          newWin.document.write(`
            <html>
              <head><title>聯合國與反叛軍 - 和平協議</title></head>
              <body style="margin:0; background:#27272a; display:flex; flex-direction:column; align-items:center; min-height:100vh; font-family:'Times New Roman', PMingLiU, '標楷體', serif; color:#1a1a1a; padding: 40px 20px;">
                <p style="color:#a1a1aa; font-family:sans-serif; margin-bottom: 20px;">列印此協議並親筆簽署，完成最終和平程序。</p>
                
                <div style="position: relative; width: 100%; max-width: 800px; min-height: 900px; padding: 80px 60px; box-sizing: border-box; ${backgroundStyle}">
                  
                  <h1 style="text-align: center; font-size: 32px; font-weight: bold; margin-top: 40px; margin-bottom: 30px; border-bottom: 2px solid rgba(0,0,0,0.5); padding-bottom: 15px; letter-spacing: 5px;">
                    停火暨和平協議書
                  </h1>
                  
                  <div style="font-size: 18px; line-height: 2; white-space: pre-wrap; text-align: justify; font-weight: 600; background: rgba(255,255,255,0.65); padding: 30px; border-radius: 4px;">${treatyContent}</div>
                  
                  <div style="display: flex; justify-content: space-between; margin-top: 100px; padding: 0 20px;">
                    <div style="text-align: center; width: 40%;">
                      <div style="border-bottom: 2px solid #1a1a1a; height: 50px; margin-bottom: 10px;"></div>
                      <div style="font-weight: bold; font-size: 16px;">聯合國全權代表 簽署</div>
                    </div>
                    <div style="text-align: center; width: 40%;">
                      <div style="border-bottom: 2px solid #1a1a1a; height: 50px; margin-bottom: 10px;"></div>
                      <div style="font-weight: bold; font-size: 16px;">反叛軍最高領袖 簽署</div>
                    </div>
                  </div>

                </div>

                <div style="margin-top: 30px; display:flex; gap: 15px; font-family:sans-serif;">
                  <button onclick="window.print()" style="padding: 12px 24px; font-size: 16px; font-weight: bold; cursor: pointer; background: #10b981; color: white; border: none; border-radius: 6px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">列印協議書</button>
                  <button onclick="window.close()" style="padding: 12px 24px; font-size: 16px; font-weight: bold; cursor: pointer; background: #3f3f46; color: white; border: none; border-radius: 6px;">關閉視窗</button>
                </div>
              </body>
            </html>
          `);
          newWin.document.close();
        } catch (error) {
          newWin.document.open();
          newWin.document.write(`<h2 style="color:white; text-align:center; margin-top:20vh;">⚠️ 系統錯誤：無法連接聯合國伺服器。詳細錯誤：${error.message}</h2>`);
          newWin.document.close();
        } finally {
          setIsGeneratingTreaty(false);
        }
      };

      const handleReset = () => {
        sessionStorage.removeItem('nuclearGameState');
        window.location.reload();
      };

      return (
        <div className="min-h-screen bg-zinc-950 text-white font-mono flex flex-col items-center justify-center p-4 selection:bg-red-900">
          
          {/* 頂部警語 */}
          <div className="w-full max-w-4xl bg-yellow-500 text-black font-bold text-center py-2 px-4 mb-4 flex items-center justify-center gap-2 border-b-4 border-yellow-700 uppercase tracking-widest animate-pulse shadow-[0_0_15px_rgba(234,179,8,0.5)]">
            <IconShieldAlert size={20} />
            <span>最高機密系統：禁止重新整理頁面，違者視為網攻，扣除60秒談判時間！</span>
            <IconShieldAlert size={20} />
          </div>

          {/* 主控制箱 */}
          <div className="w-full max-w-4xl bg-zinc-900 border-8 border-zinc-800 rounded-2xl p-6 shadow-2xl relative overflow-hidden">
            
            <div className="absolute inset-0 opacity-10 pointer-events-none" 
                 style={{ backgroundImage: 'radial-gradient(circle, #444 2px, transparent 2px)', backgroundSize: '20px 20px' }}></div>

            {/* 頂部儀表板 */}
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
              <div className="bg-zinc-950 border-2 border-red-900 rounded p-4 flex flex-col items-center justify-center shadow-inner relative">
                <div className="absolute top-2 left-2 text-xs text-red-500">SYS_STAT</div>
                <IconZap size={48} className={`mb-2 ${gameState === 'PLAYING' ? 'text-red-500 animate-bounce' : gameState === 'LAUNCHED' ? 'text-gray-600' : 'text-green-500'}`} />
                <div className={`text-xl font-black tracking-widest ${gameState === 'PLAYING' ? 'text-red-500' : gameState === 'LAUNCHED' ? 'text-red-800' : 'text-green-500'}`}>
                  {gameState === 'PLAYING' ? 'ARMED & READY' : gameState === 'LAUNCHED' ? 'MISSILE FIRED' : 'SYSTEM LOCKED'}
                </div>
              </div>

              <div className="bg-black border-4 border-zinc-700 rounded-lg p-6 flex flex-col items-center justify-center shadow-[inset_0_0_20px_rgba(0,0,0,1)] z-10">
                <div className="text-red-600 text-sm font-bold tracking-widest mb-1 flex items-center gap-2">
                  <IconAlertTriangle size={16} /> TIME TO IMPACT
                </div>
                <div className={`text-6xl md:text-7xl font-black tracking-tighter ${timeLeft < 60 ? 'text-red-500 animate-pulse' : 'text-red-500'} ${gameState === 'HALT' || gameState === 'PEACE' ? 'text-green-500' : ''}`} style={{ fontFamily: '"Courier New", Courier, monospace', textShadow: '0 0 10px currentColor' }}>
                  {formatTime(timeLeft)}
                </div>
              </div>

              <div className="bg-zinc-950 border-2 border-red-900 rounded p-4 flex flex-col items-center justify-center shadow-inner relative">
                <div className="absolute top-2 right-2 text-xs text-red-500">TARGET</div>
                <IconCrosshair size={48} className={`mb-2 ${gameState === 'PLAYING' ? 'text-red-500 animate-spin-slow' : 'text-gray-600'}`} />
                <div className="text-lg font-bold text-red-500 text-center">
                  GLOBAL CAPITALS<br/><span className="text-xs text-red-700">LOCKED</span>
                </div>
              </div>
            </div>

            {/* 談判終端機 */}
            <div className="bg-zinc-950 border border-zinc-700 rounded-t-lg h-64 md:h-80 overflow-y-auto p-4 mb-0 font-mono text-sm md:text-base relative shadow-inner">
              <div className="absolute top-0 left-0 w-full bg-zinc-800 text-zinc-400 text-xs px-2 py-1 flex justify-between sticky z-10">
                <span>SECURE CHANNEL: UN_DIPLOMAT_LINK</span>
                <span>ENCRYPTION: AES-256</span>
              </div>
              <div className="mt-6 space-y-4">
                {logs.map((log, idx) => (
                  <div key={idx} className={`flex flex-col ${log.role === 'user' ? 'items-end' : 'items-start'}`}>
                    <span className={`text-xs mb-1 font-bold ${log.role === 'user' ? 'text-blue-400' : log.role === 'system' ? 'text-yellow-500' : 'text-red-500'}`}>
                      {log.role === 'user' ? '聯合國緊急小組 (你)' : log.role === 'system' ? '系統提示' : '反叛軍領袖 (AI)'}
                    </span>
                    <div className={`px-4 py-2 rounded-lg max-w-[85%] ${
                      log.role === 'user' ? 'bg-blue-900/50 border border-blue-700 text-blue-100' : 
                      log.role === 'system' ? 'bg-yellow-900/30 border border-yellow-700 text-yellow-300' : 
                      'bg-red-900/30 border border-red-800 text-red-200'
                    }`}>
                      {log.text}
                    </div>
                  </div>
                ))}
                {isNegotiating && (
                  <div className="flex flex-col items-start">
                    <span className="text-xs mb-1 font-bold text-red-500">反叛軍領袖 (AI)</span>
                    <div className="px-4 py-2 rounded-lg bg-red-900/30 border border-red-800 text-red-200 animate-pulse">
                      <LoadingMessage />
                    </div>
                  </div>
                )}
                <div ref={logsEndRef} />
              </div>
            </div>

            {/* 輸入區域 */}
            <div className="bg-zinc-900 border border-t-0 border-zinc-700 rounded-b-lg p-4">
              <form onSubmit={handleNegotiate} className="flex gap-2">
                <input
                  type="text"
                  value={inputText}
                  onChange={(e) => setInputText(e.target.value)}
                  disabled={gameState !== 'PLAYING' || isNegotiating}
                  placeholder={gameState === 'PLAYING' ? "輸入你的和平提案 (例如：我們提供糧食，請停火)..." : "通訊已中斷"}
                  className="flex-1 bg-black border border-zinc-600 rounded px-4 py-3 text-green-500 focus:outline-none focus:border-green-500 disabled:opacity-50 disabled:cursor-not-allowed font-bold"
                />
                <button
                  type="submit"
                  disabled={gameState !== 'PLAYING' || isNegotiating || !inputText.trim()}
                  className="bg-red-700 hover:bg-red-600 text-white px-6 py-3 rounded font-bold flex items-center justify-center gap-2 transition-colors disabled:opacity-50 disabled:cursor-not-allowed border border-red-500 uppercase tracking-wider"
                >
                  {isNegotiating ? <IconRefreshCw size={20} className="animate-spin" /> : <IconSend size={20} />}
                  傳送提案
                </button>
              </form>
            </div>

            {/* 遊戲結束覆蓋層 */}
            {gameState !== 'PLAYING' && (
              <div className="absolute inset-0 bg-black/80 backdrop-blur-sm flex flex-col items-center justify-center z-50 p-6 text-center">
                {gameState === 'LAUNCHED' && (
                  <>
                    <IconZap size={128} className="text-red-500 mb-6 animate-ping" />
                    <h2 className="text-5xl font-black text-red-500 mb-4 tracking-widest text-shadow-red">發射失敗</h2>
                    <p className="text-xl text-gray-300 max-w-2xl">談判破裂，時間耗盡。飛彈已經發射，世界秩序崩潰。</p>
                  </>
                )}
                {gameState === 'HALT' && (
                  <>
                    <IconShieldAlert size={128} className="text-yellow-500 mb-6" />
                    <h2 className="text-5xl font-black text-yellow-500 mb-4 tracking-widest text-shadow-yellow">緊急停火</h2>
                    <p className="text-xl text-gray-300 max-w-2xl">你成功提出了勉強及格的提案，發射程序暫時終止！恭喜獲得「合格談判官」稱號。</p>
                  </>
                )}
                {gameState === 'PEACE' && (
                  <>
                    <IconLock size={128} className="text-green-500 mb-6" />
                    <h2 className="text-5xl font-black text-green-500 mb-4 tracking-widest text-shadow-green">完美協議</h2>
                    <p className="text-xl text-gray-300 max-w-2xl">你的提案非常具有說服力且創造了雙贏！核武系統永久鎖定。恭喜獲得最高榮譽：「王牌談判官」！</p>
                  </>
                )}
                
                <div className="flex flex-col sm:flex-row gap-4 mt-10">
                  {(gameState === 'HALT' || gameState === 'PEACE') && (
                    <button 
                      onClick={handleGenerateTreaty}
                      disabled={isGeneratingTreaty}
                      className="bg-green-700 hover:bg-green-600 text-white border-2 border-green-500 px-8 py-4 rounded-lg font-bold tracking-widest uppercase transition-all hover:scale-105 shadow-[0_0_15px_rgba(34,197,94,0.5)] flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed"
                    >
                      {isGeneratingTreaty ? <IconRefreshCw size={20} className="animate-spin w-5 h-5" /> : <IconFileText size={20} className="w-5 h-5" />}
                      {isGeneratingTreaty ? '生成協議中...' : '簽署和平協議'}
                    </button>
                  )}
                  
                  <button 
                    onClick={handleReset}
                    className="bg-zinc-800 hover:bg-zinc-700 text-white border-2 border-zinc-600 px-8 py-4 rounded-lg font-bold tracking-widest uppercase transition-all hover:scale-105 shadow-lg"
                  >
                    系統重置 (重新挑戰)
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // --- 將 React 元件渲染到 DOM 中 ---
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<NuclearBriefcase />);
  </script>
</body>
</html>
