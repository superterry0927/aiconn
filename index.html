<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全球危機處理系統 | 核彈倒數談判</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for LED Timer and standard text -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Noto Sans TC', 'sans-serif'],
                        mono: ['Share Tech Mono', 'monospace'],
                    },
                    backgroundImage: {
                        'hazard': 'repeating-linear-gradient(45deg, #000 0, #000 10px, #eab308 10px, #eab308 20px)',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #111; color: #eee; }
        .led-text { color: #ff003c; text-shadow: 0 0 10px #ff003c, 0 0 20px #ff003c; }
        .led-text-paused { color: #eab308; text-shadow: 0 0 10px #eab308, 0 0 20px #eab308; }
        .glass-panel { background: rgba(20, 20, 20, 0.8); border: 2px solid #333; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); }
        .scanline {
            width: 100%; height: 100%; z-index: 50; position: absolute; pointer-events: none;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
            background-size: 100% 4px;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #666; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col font-sans select-none">
    <div class="scanline"></div>

    <!-- Main Game UI (核發射箱介面) -->
    <div id="game-screen" class="flex-1 flex flex-col h-full max-w-6xl mx-auto w-full p-4 md:p-8 relative z-10">
        
        <!-- Header & Warning -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4 border-b-2 border-zinc-800 pb-4">
            <div class="flex items-center gap-4">
                <div class="w-16 h-16 rounded-full border-4 border-red-600 flex items-center justify-center bg-black animate-pulse">
                    <i class="fa-solid fa-radiation text-3xl text-red-600"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-black text-white tracking-widest">全球戰略防禦局 (G.S.D.A)</h1>
                    <p class="text-red-500 font-bold tracking-widest text-sm">核打擊倒數程序已啟動</p>
                </div>
            </div>
            
            <div class="bg-red-900/40 border border-red-500 px-4 py-2 rounded">
                <p class="text-red-400 font-bold text-sm">
                    <i class="fa-solid fa-skull-crossbones mr-2"></i>警告：嚴禁重新整理頁面。系統若偵測到中斷，將扣除 60 秒談判時間！
                </p>
            </div>
        </header>

        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col lg:flex-row gap-6 h-full overflow-hidden">
            
            <!-- Left Panel: Timer & Enemy Status -->
            <div class="lg:w-1/3 flex flex-col gap-6">
                <!-- Timer Display -->
                <div class="glass-panel rounded-xl p-6 flex flex-col items-center justify-center relative border-t-8 border-t-red-600 shadow-lg">
                    <div class="absolute top-0 left-0 w-full h-2 bg-hazard opacity-50"></div>
                    <h2 class="text-zinc-500 font-bold tracking-widest mb-2 mt-2">距飛彈發射剩餘時間</h2>
                    <div id="timer-display" class="text-7xl md:text-8xl font-mono led-text font-bold tracking-tighter">
                        10:00
                    </div>
                    <div id="timer-status" class="mt-4 px-4 py-1 rounded bg-red-950 text-red-500 font-bold border border-red-800 animate-pulse">
                        致命倒數中
                    </div>
                </div>

                <!-- Enemy AI Profile -->
                <div class="glass-panel rounded-xl flex-1 p-6 flex flex-col items-center">
                    <h3 class="text-zinc-500 font-bold mb-4 w-full border-b border-zinc-700 pb-2">敵方指揮官 (AI)</h3>
                    <div class="w-32 h-32 rounded-full border-4 border-zinc-600 bg-zinc-800 flex items-center justify-center overflow-hidden mb-4 relative">
                        <i class="fa-solid fa-user-secret text-6xl text-zinc-500"></i>
                        <div class="absolute inset-0 bg-red-500/20 mix-blend-overlay"></div>
                    </div>
                    <div class="text-center w-full">
                        <p class="text-white font-bold text-lg mb-1">【代號：末日狂人】</p>
                        <p class="text-zinc-400 text-sm mb-4">目標：摧毀所有反對勢力</p>
                        <div class="w-full bg-black rounded-full h-4 border border-zinc-700 relative overflow-hidden">
                            <div id="peace-bar" class="bg-red-600 h-full transition-all duration-1000 ease-out w-[10%]"></div>
                            <span class="absolute inset-0 flex items-center justify-center text-[10px] font-bold text-white z-10">和平指數 <span id="peace-score-text">10</span>%</span>
                        </div>
                        <p class="text-xs text-zinc-500 mt-2">目標：60% 暫停發射 / 85% 達成停火</p>
                    </div>
                </div>
            </div>

            <!-- Right Panel: Negotiation Interface -->
            <div class="lg:w-2/3 flex flex-col glass-panel rounded-xl border-t-8 border-t-zinc-600 overflow-hidden relative">
                
                <!-- Chat History -->
                <div id="chat-history" class="flex-1 overflow-y-auto p-6 flex flex-col gap-4">
                    <!-- Initial Message -->
                    <div class="flex gap-4">
                        <div class="w-10 h-10 rounded-full bg-zinc-800 flex items-center justify-center border border-zinc-600 flex-shrink-0">
                            <i class="fa-solid fa-robot text-zinc-400"></i>
                        </div>
                        <div class="bg-zinc-800 p-4 rounded-2xl rounded-tl-none border border-zinc-700 max-w-[85%] shadow-md">
                            <p class="text-white">我是敵方總統。飛彈已經進入發射倒數階段。你們這些偽善的傢伙，除非能給出讓我滿意的條件，否則世界將在十分鐘後毀滅。你有什麼遺言或提案嗎？</p>
                        </div>
                    </div>
                </div>

                <!-- Input Area -->
                <div class="p-4 bg-zinc-900 border-t border-zinc-700">
                    <form id="negotiation-form" onsubmit="submitProposal(event)" class="relative">
                        <textarea 
                            id="proposal-input" 
                            class="w-full bg-black text-white p-4 pr-32 rounded-lg border border-zinc-600 focus:outline-none focus:border-yellow-500 focus:ring-1 focus:ring-yellow-500 resize-none h-28 font-sans" 
                            placeholder="輸入你的談判提案... (例：如果你停止發射，我們將解除經濟制裁並提供資源援助...)"
                            required
                        ></textarea>
                        <button 
                            type="submit" 
                            id="submit-btn"
                            class="absolute bottom-3 right-3 bg-red-700 hover:bg-red-600 text-white font-bold py-3 px-6 rounded transition duration-200 shadow-lg border border-red-500 disabled:opacity-50 disabled:cursor-not-allowed">
                            傳送提案 <i class="fa-solid fa-paper-plane ml-1"></i>
                        </button>
                    </form>
                </div>
                
                <!-- Loading Overlay -->
                <div id="loading-overlay" class="absolute inset-0 bg-black/80 hidden items-center justify-center z-20 backdrop-blur-sm">
                    <div class="flex flex-col items-center">
                        <i class="fa-solid fa-satellite-dish text-5xl text-yellow-500 animate-pulse mb-4"></i>
                        <p class="text-yellow-500 font-mono tracking-widest text-xl">正在傳輸加密頻道...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Result Modal -->
    <div id="result-modal" class="fixed inset-0 z-[100] bg-black hidden flex-col items-center justify-center p-4 text-center">
        <div id="result-icon" class="text-8xl mb-6"></div>
        <h1 id="result-title" class="text-5xl font-black mb-4 tracking-widest"></h1>
        <p id="result-message" class="text-xl text-zinc-300 max-w-2xl mb-8 leading-relaxed"></p>
        <button onclick="location.reload()" class="px-8 py-4 bg-zinc-800 hover:bg-zinc-700 text-white font-bold rounded border border-zinc-600 transition">
            <i class="fa-solid fa-rotate-right mr-2"></i>重新開啟模擬系統
        </button>
    </div>

    <script>
    // Game State Variables
    let apiKey = "AIzaSyAj7DfAzrZURfDlnymPpeFb7dRQSWVGB5c"; // ★ 請將引號內替換成您的真實 API 金鑰
    const TOTAL_TIME = 10 * 60; // 10 minutes in seconds
    let timeRemaining = TOTAL_TIME;
    let timerInterval;
    let isPaused = false;
    let isGameOver = false;

    // Elements
    const gameScreen = document.getElementById('game-screen');
    const timerDisplay = document.getElementById('timer-display');
        const timerStatus = document.getElementById('timer-status');
        const chatHistory = document.getElementById('chat-history');
        const proposalInput = document.getElementById('proposal-input');
        const submitBtn = document.getElementById('submit-btn');
        const peaceBar = document.getElementById('peace-bar');
        const peaceScoreText = document.getElementById('peace-score-text');
        const loadingOverlay = document.getElementById('loading-overlay');
        const resultModal = document.getElementById('result-modal');
        const resultIcon = document.getElementById('result-icon');
        const resultTitle = document.getElementById('result-title');
    const resultMessage = document.getElementById('result-message');

    // Initialization & Anti-Cheat Logic
    function initializeSystem() {
        if (!apiKey || apiKey === "YOUR_API_KEY_HERE") {
            alert("系統錯誤：尚未設定 API 金鑰！請老師先在程式碼內填入金鑰。");
            return;
        }
        
        // Check Anti-Cheat (Refresh penalty)
        const savedEndTime = localStorage.getItem('nuclear_end_time');
        const now = Date.now();
        
        if (savedEndTime && parseInt(savedEndTime) > now) {
            // User refreshed the page! Deduct 60 seconds (60000 ms)
            let newEndTime = parseInt(savedEndTime) - 60000;
            localStorage.setItem('nuclear_end_time', newEndTime);
            timeRemaining = Math.max(0, Math.floor((newEndTime - now) / 1000));
            addSystemMessage("警告：偵測到非正常連線中斷，系統已強制扣除 60 秒談判時間！", "error");
        } else {
            // First load or previous game ended
            const targetEndTime = now + (TOTAL_TIME * 1000);
            localStorage.setItem('nuclear_end_time', targetEndTime);
            timeRemaining = TOTAL_TIME;
        }
        
        startTimer();
        document.getElementById('proposal-input').focus();
    }

    // Timer Logic
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            
            timerInterval = setInterval(() => {
                if (isPaused || isGameOver) return;
                
                const now = Date.now();
                const savedEndTime = parseInt(localStorage.getItem('nuclear_end_time') || now);
                timeRemaining = Math.max(0, Math.floor((savedEndTime - now) / 1000));

                updateTimerDisplay();

                if (timeRemaining <= 0) {
                    triggerGameOver("時間耗盡", "飛彈已發射，談判失敗。世界陷入火海...", false);
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timeRemaining / 60);
            const seconds = timeRemaining % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            if (timeRemaining < 60 && !isPaused) {
                timerDisplay.classList.add('animate-ping'); // Emergency flash
            } else {
                timerDisplay.classList.remove('animate-ping');
            }
        }

        // Add Messages to UI
        function addMessage(sender, text) {
            const isUser = sender === 'user';
            const html = `
                <div class="flex gap-4 ${isUser ? 'flex-row-reverse' : ''}">
                    <div class="w-10 h-10 rounded-full ${isUser ? 'bg-blue-900 border-blue-500' : 'bg-zinc-800 border-zinc-600'} flex items-center justify-center border flex-shrink-0">
                        <i class="fa-solid ${isUser ? 'fa-user-tie text-blue-300' : 'fa-robot text-zinc-400'}"></i>
                    </div>
                    <div class="${isUser ? 'bg-blue-900/50 border-blue-700 rounded-tr-none' : 'bg-zinc-800 border-zinc-700 rounded-tl-none'} p-4 rounded-2xl border max-w-[85%] shadow-md whitespace-pre-wrap">
                        <p class="text-white">${escapeHTML(text)}</p>
                    </div>
                </div>
            `;
            chatHistory.insertAdjacentHTML('beforeend', html);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        function addSystemMessage(text, type = "info") {
            const colors = type === "error" ? "text-red-500 border-red-900/50" : (type === "success" ? "text-green-400 border-green-900/50" : "text-yellow-500 border-yellow-900/50");
            const html = `
                <div class="flex justify-center my-2">
                    <div class="bg-black border ${colors} px-4 py-2 rounded-full text-sm font-bold tracking-wider shadow-lg">
                        <i class="fa-solid fa-circle-info mr-2"></i>${text}
                    </div>
                </div>
            `;
            chatHistory.insertAdjacentHTML('beforeend', html);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }

        // Call Gemini API
        async function submitProposal(event) {
            event.preventDefault();
            if (isGameOver) return;
            
            const text = proposalInput.value.trim();
            if (!text) return;

            // UI Updates
            addMessage('user', text);
            proposalInput.value = '';
            submitBtn.disabled = true;
            loadingOverlay.classList.remove('hidden');
            loadingOverlay.classList.add('flex');

            try {
                // System Prompt Instruction for Gemini
                const systemPrompt = `你現在扮演一位擁有核彈發射按鈕的敵方獨裁總統。飛彈發射倒數中。
使用者是聯合國大使，試圖說服你放棄發射核彈並達成和平。
請根據使用者的提案內容，嚴格給出一個0到100分的「和平指數」，並給予符合你獨裁者性格的回覆。

【評分標準】
0-30分：提案毫無邏輯、充滿挑釁、毫無誠意或威脅你。
31-59分：有些道理，但沒有給你足夠的利益或面子，不足以讓你停火。
60-84分：提案具備實質的利益交換（例如：解除經濟制裁、提供資源物資、劃分勢力範圍等），這讓你願意「暫停發射」來考慮。
85-100分：提案非常完美，不僅有極高的實質利益，還充分顧及了你的尊嚴與國家面子，讓你願意簽署和平協議並永久終止發射。

【輸出格式】
你必須且只能回傳合法的 JSON 格式，不要加入任何 markdown 語法 (如 \`\`\`json)，直接回傳 JSON。包含以下兩個屬性：
{
  "score": (數字，0-100),
  "reply": "(字串，你以獨裁總統口吻的回覆，並在語氣中暗示為何給這個分數。語氣要強勢且符合情境)"
}`;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                        generationConfig: { 
                            responseMimeType: "application/json",
                            responseSchema: {
                                type: "OBJECT",
                                properties: {
                                    score: { type: "INTEGER" },
                                    reply: { type: "STRING" }
                                }
                            }
                        }
                    })
                });

                if (!response.ok) throw new Error('API Request Failed');
                
                const data = await response.json();
                const resultText = data.candidates[0].content.parts[0].text;
                
                // Parse JSON
                let resultObj;
                try {
                    resultObj = JSON.parse(resultText);
                } catch (e) {
                    // Fallback cleanup if Gemini included markdown formatting by accident
                    const cleaned = resultText.replace(/```json/g, '').replace(/```/g, '').trim();
                    resultObj = JSON.parse(cleaned);
                }

                handleAIResponse(resultObj.score, resultObj.reply);

            } catch (error) {
                console.error("API Error:", error);
                addSystemMessage("通訊干擾！無法接收敵方回應，請再試一次。", "error");
            } finally {
                submitBtn.disabled = false;
                loadingOverlay.classList.add('hidden');
                loadingOverlay.classList.remove('flex');
                proposalInput.focus();
            }
        }

        // Logic based on Score
        function handleAIResponse(score, reply) {
            // Update Bar
            peaceScoreText.textContent = score;
            peaceBar.style.width = `${score}%`;
            
            // Color mapping
            if(score >= 85) peaceBar.className = "h-full transition-all duration-1000 ease-out bg-green-500";
            else if(score >= 60) peaceBar.className = "h-full transition-all duration-1000 ease-out bg-yellow-500";
            else peaceBar.className = "h-full transition-all duration-1000 ease-out bg-red-600";

            addMessage('ai', reply);

            if (score >= 85) {
                // Victory!
                isGameOver = true;
                clearInterval(timerInterval);
                localStorage.removeItem('nuclear_end_time'); // Clear penalty memory
                setTimeout(() => triggerGameOver("協議達成", "你用高超的談判技巧成功說服敵方放棄攻擊，世界和平得以保全！你獲得了【王牌談判官】稱號！", true), 1500);
            } else if (score >= 60) {
                // Pause Timer
                if (!isPaused) {
                    isPaused = true;
                    // freeze end time locally so it doesn't keep counting down in the background
                    const now = Date.now();
                    const currentRemainingMs = timeRemaining * 1000;
                    // We don't update local storage yet, we just pause. If they refresh while paused, 
                    // we'll need to handle it, but for simplicity let's update localstorage to now + remaining
                    localStorage.setItem('nuclear_end_time', now + currentRemainingMs);
                    
                    timerDisplay.classList.remove('led-text');
                    timerDisplay.classList.add('led-text-paused');
                    timerStatus.textContent = "倒數暫停：敵方考慮中";
                    timerStatus.className = "mt-4 px-4 py-1 rounded bg-yellow-950 text-yellow-500 font-bold border border-yellow-800";
                    addSystemMessage("達成基本門檻：敵方對提案感興趣，飛彈倒數暫停！請乘勝追擊提出最終協議！", "success");
                } else {
                    addSystemMessage("維持暫停狀態，請繼續加碼條件以達成最終和平協議 (85分以上)。", "info");
                }
            } else {
                // Resume timer if it was paused
                if (isPaused) {
                    isPaused = false;
                    const now = Date.now();
                    localStorage.setItem('nuclear_end_time', now + (timeRemaining * 1000));
                    
                    timerDisplay.classList.remove('led-text-paused');
                    timerDisplay.classList.add('led-text');
                    timerStatus.textContent = "致命倒數中";
                    timerStatus.className = "mt-4 px-4 py-1 rounded bg-red-950 text-red-500 font-bold border border-red-800 animate-pulse";
                    addSystemMessage("條件不足，敵方失去耐心，倒數計時重新啟動！", "error");
                }
            }
        }

        // End Game UI
        function triggerGameOver(title, message, isVictory) {
            isGameOver = true;
            localStorage.removeItem('nuclear_end_time');
            
            resultTitle.textContent = title;
            resultMessage.textContent = message;
            
            if (isVictory) {
                resultTitle.className = "text-5xl font-black mb-4 tracking-widest text-green-500";
                resultIcon.innerHTML = '<i class="fa-solid fa-dove text-green-500 drop-shadow-[0_0_15px_rgba(34,197,94,0.8)]"></i>';
            } else {
                resultTitle.className = "text-5xl font-black mb-4 tracking-widest text-red-600";
        resultIcon.innerHTML = '<i class="fa-solid fa-radiation text-red-600 drop-shadow-[0_0_20px_rgba(220,38,38,1)]"></i>';
    }
    
    resultModal.classList.remove('hidden');
    resultModal.classList.add('flex');
}

// 頁面載入後自動啟動系統
window.onload = initializeSystem;
</script>
</body>
</html>
